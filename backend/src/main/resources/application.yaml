server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:worksight;DB_CLOSE_DELAY=-1;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: worksight-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 1800000  # 30분 (ms)

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.worksight.api: DEBUG