<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSight — Dev Test Console</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Link -->
    <link rel="stylesheet" href="test.css">
</head>
<body>



<!-- Header -->
<div class="header">
    <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
    </div>
    <div class="header-text">
        <h1>WorkSight</h1>
        <p>Dev Test Console · localhost:8080</p>
    </div>
    <div class="env-badge">DEV / LOCAL</div>
</div>

<!-- Toast Container -->
<div class="toast-wrap" id="toast-wrap"></div>

<div class="grid">

    <!-- ── 현재 세션 ── -->
    <div class="card full" style="border-top: 2px solid var(--cyan);">
        <div class="card-title">현재 활성 세션 (Current Session)</div>
        <div class="session-banner" id="session-banner">
            <span class="session-empty">// 로그인이 필요합니다. 아래에서 회원가입 후 로그인을 진행하세요.</span>
        </div>
        <button class="btn btn-red" id="logout-btn" style="display:none;" onclick="logout()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            로그아웃
        </button>
    </div>

    <!-- ── 회원가입 ── -->
    <div class="card">
        <div class="card-title">01 · 회원가입 (Sign Up)</div>
        <div class="field">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="newuser">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>
        <div class="field">
            <label>Role</label>
            <select id="reg-role">
                <option value="EMPLOYEE">👤 EMPLOYEE (직원)</option>
                <option value="MANAGER">👔 MANAGER (관리자)</option>
            </select>
        </div>
        <button class="btn btn-cyan" onclick="handleSignUp()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M12.5 7a4 4 0 1 1 0-.001M19 8v6M22 11h-6"/></svg>
            계정 생성
        </button>
        <div class="error-box" id="signup-error"></div>
    </div>

    <!-- ── 로그인 ── -->
    <div class="card">
        <div class="card-title">02 · 로그인 (Login)</div>
        <div class="field">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="username">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn btn-cyan" onclick="handleLogin()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            로그인
        </button>
        <div class="error-box" id="login-error"></div>
    </div>

    <!-- ── 모니터링 이벤트 ── -->
    <div class="card">
        <div class="card-title">03 · 상태 보고 (Monitoring Event)</div>
        <p style="font-size:0.78rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-bottom:16px;">// 로그인 후 AI 감지 이벤트를 서버로 전송</p>
        <div class="event-grid">
            <button class="btn-event ev-sleep"    onclick="sendEvent('SLEEP')">😴 졸음</button>
            <button class="btn-event ev-phone"    onclick="sendEvent('SMARTPHONE')">📱 폰 사용</button>
            <button class="btn-event ev-away"     onclick="sendEvent('AWAY')">🚶 이탈</button>
            <button class="btn-event ev-distract" onclick="sendEvent('DISTRACTED')">😵 산만</button>
            <button class="btn-event ev-normal"   onclick="sendEvent('NORMAL')">✅ 정상 (NORMAL)</button>
        </div>
    </div>

    <!-- ── 시스템 로그 ── -->
    <div class="card">
        <div class="card-title">시스템 로그 (System Log)</div>
        <div class="log-box" id="log-box">
            <div class="log-line">
                <span class="log-time">--:--:--</span>
                <span class="log-tag tag-info">INIT</span>
                <span class="log-text">WorkSight Dev Console 준비 완료.</span>
            </div>
        </div>
    </div>

</div>

<!-- JS Link -->
<script src="test.js"></script>
</body>
</html>
