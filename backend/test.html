<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WorkSight - All-in-One Test Dashboard</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 1000px; margin: 40px auto; background-color: #f0f2f5; color: #1e293b; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .full { grid-column: span 2; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #334155; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }

        /* Input & Buttons */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #64748b; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }

        .btn-auth { background: #3b82f6; color: white; }
        .btn-auth:hover { background: #2563eb; }
        .btn-event { background: #f59e0b; color: white; }
        .btn-event:hover { background: #d97706; }
        .btn-normal { background: #10b981; color: white; }

        /* Status Card */
        #status-display { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .user-tag { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; }

        /* Log */
        #log-container { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 10px; font-family: 'Fira Code', monospace; height: 250px; overflow-y: auto; font-size: 0.85rem; line-height: 1.5; }
        .event-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    </style>
</head>
<body>

<h1 style="text-align: center; margin-bottom: 30px;">WorkSight 통합 테스트 센터</h1>

<!-- 1. 현재 접속 세션 상태 -->
<section class="full" style="border-top: 5px solid #3b82f6;">
    <h2>현재 활성 세션 (Current Session)</h2>
    <div id="status-display">
        <p id="session-msg" style="text-align: center; color: #94a3b8;">로그인이 필요합니다. (회원가입 후 로그인을 진행해 주세요)</p>
    </div>
    <button id="logout-btn" class="btn-event" style="background:#ef4444; display:none;" onclick="logout()">로그아웃</button>
</section>

<div class="grid">
    <!-- 2. 회원가입 -->
    <section>
        <h2>1. 회원가입 (Sign Up)</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="newuser">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label>Role</label>
            <select id="reg-role">
                <option value="EMPLOYEE">EMPLOYEE</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <button class="btn-auth" onclick="handleAuth('/signup', 'reg')">계정 생성</button>
    </section>

    <!-- 3. 로그인 -->
    <section>
        <h2>2. 로그인 (Login)</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="password">
        </div>
        <button class="btn-auth" onclick="handleAuth('/login', 'login')">로그인</button>
    </section>

    <!-- 4. 모니터링 이벤트 발생 -->
    <section>
        <h2>3. 상태 보고 (Monitoring)</h2>
        <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">AI 모듈이 감지한 상태를 서버로 전송합니다.</p>
        <div class="event-grid">
            <button class="btn-event" onclick="sendEvent('SLEEP')">졸음</button>
            <button class="btn-event" onclick="sendEvent('SMARTPHONE')">폰 사용</button>
            <button class="btn-event" onclick="sendEvent('AWAY')">이탈</button>
            <button class="btn-event" onclick="sendEvent('DISTRACTED')">산만</button>
            <button class="btn-normal" style="grid-column: span 2;" onclick="sendEvent('NORMAL')">정상 (NORMAL)</button>
        </div>
    </section>

    <!-- 5. 실행 로그 -->
    <section>
        <h2>시스템 로그 (System Log)</h2>
        <div id="log-container">프로그램이 준비되었습니다.</div>
    </section>
</div>

<script>
    const API_MEMBER = 'http://localhost:8080/api/members';
    const API_MONITOR = 'http://localhost:8080/api/monitoring';
    let currentUser = null;

    function addLog(msg, isError = false) {
        const logBox = document.getElementById('log-container');
        const time = new Date().toLocaleTimeString();
        const color = isError ? '#f87171' : '#38bdf8';
        logBox.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 인증 처리 (회원가입/로그인)
    async function handleAuth(path, prefix) {
        const data = {
            username: document.getElementById(`${prefix}-username`).value,
            password: document.getElementById(`${prefix}-password`).value
        };
        if(prefix === 'reg') data.role = document.getElementById('reg-role').value;

        addLog(`${path} 요청 중...`);
        try {
            const response = await fetch(API_MEMBER + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (response.ok) {
                addLog(`${path} 성공!`);
                if (path === '/login') {
                    currentUser = result;
                    updateUI();
                }
            } else {
                addLog(`오류: ${result.message || response.status}`, true);
            }
        } catch (e) {
            addLog(`네트워크 에러: ${e.message}`, true);
        }
    }

    // 모니터링 이벤트 전송
    async function sendEvent(type) {
        if (!currentUser) {
            alert("로그인이 필요합니다! (유저 ID 확보용)");
            return;
        }

        const payload = {
            employeeId: currentUser.id, //
            eventType: type //
        };

        addLog(`이벤트 전송 시도: ${type}`);
        try {
            const response = await fetch(API_MONITOR + '/event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.text();

            if (response.ok) {
                addLog(`서버 응답: ${result}`);
                if (type === 'NORMAL') addLog("-> NORMAL 상태는 DB에 저장되지 않습니다.");
            } else {
                addLog(`서버 에러: ${response.status}`, true);
            }
        } catch (e) {
            addLog(`네트워크 에러: ${e.message}`, true);
        }
    }

    function updateUI() {
        const display = document.getElementById('session-msg');
        const logoutBtn = document.getElementById('logout-btn');
        if (currentUser) {
            display.innerHTML = `
                    <div style="display: flex; justify-content: space-around; align-items: center;">
                        <span class="user-tag">ID: ${currentUser.id}</span>
                        <strong>${currentUser.username}</strong>
                        <span style="color: #2563eb; font-weight: bold;">잔액: ${currentUser.balance.toLocaleString()}L</span>
                    </div>
                `;
            logoutBtn.style.display = 'block';
        } else {
            display.innerText = "로그인이 필요합니다.";
            logoutBtn.style.display = 'none';
        }
    }

    function logout() {
        currentUser = null;
        updateUI();
        addLog("로그아웃 되었습니다.");
    }
</script>
</body>
</html>
