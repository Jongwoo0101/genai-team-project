<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WorkSight API Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; min-height: 50px; }
        button { cursor: pointer; padding: 5px 15px; }
    </style>
</head>
<body>
<h2>WorkSight API 테스트 (라이트 버전)</h2>

<div class="form-group">
    <h3>1. 회원가입 / 로그인</h3>
    ID: <input type="text" id="username" value="worker01"><br>
    PW: <input type="password" id="password" value="password123"><br><br>
    <button onclick="testApi('signup')">회원가입</button>
    <button onclick="testApi('login')">로그인</button>
</div>

<div>
    <h3>응답 결과:</h3>
    <pre id="result">여기에 결과가 표시됩니다.</pre>
</div>

<script>
    async function testApi(type) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const resultElement = document.getElementById('result');

        resultElement.innerText = "통신 중";

        try {
            const response = await fetch(`http://localhost:8080/api/members/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    role: 'EMPLOYEE' // 회원가입 시 필요
                })
            });

            const data = await response.json();
            resultElement.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            resultElement.innerText = "에러 발생: " + error.message +
                "\n(CORS 설정이나 서버 실행 여부를 확인)";
        }
    }
</script>
</body>
</html>
